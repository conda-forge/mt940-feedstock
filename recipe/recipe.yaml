schema_version: 1

context:
  name: mt940
  version: "5.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/mt-940/mt_940-${{ version }}.tar.gz
  sha256: bb165c60c828cfa741515caf947535d8682451a088cc06b5d81df26b5a84b851

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - uv-build
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - mt940
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A library to parse MT940 files and returns smart Python collections for statistics and manipulation.
  description: |
    A library to parse MT940 files and returns smart Python collections
    for statistics and manipulation.
  homepage: https://github.com/WoLpH/mt940
  repository: https://github.com/WoLpH/mt940
  documentation: https://mt940.readthedocs.io

extra:
  recipe-maintainers:
    - jan-janssen
